[project]
name = "cs-retail-portfolio-returns-report"
version = "0.1.0"
description = "Monthly Česká spořitelna insolvency return report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.4", "python-dotenv>=1.0.1", "openpyxl>=3.1.5", "psycopg[binary]>=3.2", "python-dateutil>=2.9", "tqdm>=4.67.1", "boto3>=1.35"]

[project.scripts]
cs-returns-report = "cs_returns_report.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cs_returns_report"
